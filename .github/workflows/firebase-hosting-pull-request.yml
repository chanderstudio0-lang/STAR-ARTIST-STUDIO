name: Deploy Preview to Firebase Hosting on PR

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-hosting-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate STAR ARTIST STUDIO PWA & Tests
        run: |
          for f in web/sw.js web/js/*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('web/firebase-config.json','utf8'))"
          node --test web/tests/pwa.test.mjs functions/tests/alerts.test.mjs

      - name: Check Firebase Service Account Secret
        id: check_firebase_secret
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0548683163 }}'
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Preview Channel to Firebase Hosting (Pull Request)
        if: steps.check_firebase_secret.outputs.configured == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          CI: "true"
          FIREBASE_CLI_PREVIEWS: hostingchannels
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0548683163 }}'
          projectId: gen-lang-client-0548683163
          expires: 7d
