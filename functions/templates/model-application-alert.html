<!-- At-a-Glance 18+ Model Application Highlights -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:18px;">
  <tr>
    <td width="33.33%" valign="top" style="padding:0 5px 0 0;">
      <div style="background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;padding:12px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{accentColor}};margin-bottom:4px;">Applicant</div>
        <div style="font-size:14px;font-weight:800;color:{{textColor}};line-height:1.3;">{{fullName}}</div>
        <div style="font-size:11px;color:{{mutedTextColor}};margin-top:2px;">{{city}}</div>
      </div>
    </td>
    <td width="33.33%" valign="top" style="padding:0 5px;">
      <div style="background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;padding:12px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{accentColor}};margin-bottom:4px;">18+ Check</div>
        <div style="font-size:13px;font-weight:800;color:{{ageHighlightColor}};line-height:1.3;">{{ageLabel}}</div>
      </div>
    </td>
    <td width="33.33%" valign="top" style="padding:0 0 0 5px;">
      <div style="background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;padding:12px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{accentColor}};margin-bottom:4px;">Consent</div>
        <div style="font-size:12px;font-weight:800;color:{{consentHighlightColor}};line-height:1.3;">{{consentText}}</div>
      </div>
    </td>
  </tr>
</table>

<!-- Full Model Application Specification Table -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;overflow:hidden;">
  {{{detailsRowsHtml}}}
</table>

{{{skillsCalloutHtml}}}
