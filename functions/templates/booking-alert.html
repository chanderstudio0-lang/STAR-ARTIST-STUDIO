<!-- At-a-Glance Shoot Booking Highlights -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:18px;">
  <tr>
    <td width="33.33%" valign="top" style="padding:0 5px 0 0;">
      <div style="background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;padding:12px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{accentColor}};margin-bottom:4px;">Event Date</div>
        <div style="font-size:14px;font-weight:800;color:{{textColor}};line-height:1.3;">{{preferredDate}}</div>
        <div style="font-size:11px;color:{{mutedTextColor}};margin-top:2px;">{{preferredTimeDisplay}}</div>
      </div>
    </td>
    <td width="33.33%" valign="top" style="padding:0 5px;">
      <div style="background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;padding:12px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{accentColor}};margin-bottom:4px;">Package</div>
        <div style="font-size:13px;font-weight:800;color:{{textColor}};line-height:1.3;">{{serviceType}}</div>
      </div>
    </td>
    <td width="33.33%" valign="top" style="padding:0 0 0 5px;">
      <div style="background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;padding:12px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{accentColor}};margin-bottom:4px;">Client</div>
        <div style="font-size:13px;font-weight:800;color:{{textColor}};line-height:1.3;">{{clientName}}</div>
      </div>
    </td>
  </tr>
</table>

<!-- Full Booking Specification Table -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;background-color:{{cardColor}};border:1px solid #2e2718;border-radius:12px;overflow:hidden;">
  {{{detailsRowsHtml}}}
</table>

{{{notesCalloutHtml}}}
